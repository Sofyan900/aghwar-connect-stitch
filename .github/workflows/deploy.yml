name: Deploy Aghwar Connect to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare
        run: |
          rm -rf site extracted
          mkdir -p site extracted

          ZIP=$(find . -maxdepth 1 -type f -name 'Aghwar_Connect_Netlify_Ready*.zip' | head -n 1)

          if [ -z "$ZIP" ]; then
            echo "ZIP file not found"
            exit 1
          fi

          unzip -q "$ZIP" -d extracted

      - name: Build all Stitch screens
        run: |
          python3 <<'PY'
          import json
          import os
          import shutil
          import glob

          with open("route-map.json", "r", encoding="utf-8") as f:
              data = json.load(f)

          routes = data.get("routes", data) if isinstance(data, dict) else data

          if not isinstance(routes, list):
              raise SystemExit("route-map.json format is invalid")

          count = 0

          for item in routes:
              route = item.get("route")
              source = item.get("source")

              if not route or not source:
                  continue

              source_file = os.path.join("extracted", source)

              if not os.path.isfile(source_file):
                  matches = glob.glob(
                      os.path.join("extracted", "**", source),
                      recursive=True
                  )
                  if matches:
                      source_file = matches[0]

              if not os.path.isfile(source_file):
                  print("MISSING:", source)
                  continue

              clean_route = route.strip("/")
              destination = os.path.join("site", clean_route, "index.html")

              
