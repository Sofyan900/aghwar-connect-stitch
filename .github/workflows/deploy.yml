name: Deploy Aghwar Connect to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare
        run: |
          rm -rf site extracted
          mkdir -p site extracted
          ZIP=$(find . -maxdepth 1 -type f -name 'Aghwar_Connect_Netlify_Ready*.zip' | head -n 1)
          if [ -z "$ZIP" ]; then
            echo "ZIP file not found"
            exit 1
          fi
          unzip -q "$ZIP" -d extracted

      - name: Build all 68 Stitch screens
        run: |
          node -e 'const fs=require("fs"),path=require("path"); const data=JSON.parse(fs.readFileSync("route-map.json","utf8")); const screens=data.screens||[]; const expected=data.screen_count||68; if(!screens.length) throw new Error("No screens found in route-map.json"); let files=[]; function walk(dir){for(const e of fs.readdirSync(dir,{withFileTypes:true})){const p=path.join(dir,e.name);if(e.isDirectory())walk(p);else files.push(p)}} walk("extracted"); let count=0; for(const s of screens){const wanted=s.source.replace(/\\/g,"/"); const src=files.find(f=>f.replace(/\\/g,"/").endsWith(wanted)); if(!src)throw new Error("Source not found: "+s.source); const route=(s.route||"/").replace(/^\/|\/$/g,""); const dest=route?path.join("site",route,"index.html"):path.join("site","index.html"); fs.mkdirSync(path.dirname(dest),{recursive:true}); fs.copyFileSync(src,dest); count++;} if(count!==expected)throw new Error("Expected "+expected+" screens, built "+count); console.log("Built "+count+" screens successfully");'

      - name: Set home page
        run: |
          if [ ! -f site/home/index.html ]; then
            echo "Home screen not found"
            exit 1
          fi
          cp site/home/index.html site/index.html

      - name: Preserve 404
        run: |
          if [ -f 404.html ]; then
            cp 404.html site/404.html
          fi

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
