
     name: Deploy Aghwar Connect to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare
        run: |
          rm -rf site extracted
          mkdir -p site extracted

          ZIP=$(find . -maxdepth 1 -type f -name 'Aghwar_Connect_Netlify_Ready*.zip' | head -n 1)

          if [ -z "$ZIP" ]; then
            echo "ZIP file not found"
            exit 1
          fi

          unzip -q "$ZIP" -d extracted

      - name: Build all 68 Stitch screens
        run: |
          python3 <<'PY'
          import json
          import os
          import shutil
          import glob

          with open("route-map.json", "r", encoding="utf-8") as f:
              outer = json.load(f)

          content = outer.get("content")

          if not content:
              raise SystemExit("route-map.json content not found")

          data = json.loads(content)
          screens = data.get("screens", [])

          if not isinstance(screens, list):
              raise SystemExit("screens list not found")

          count = 0

          for screen in screens:
              route = screen.get("route")
              source = screen.get("source")

              if not route or not source:
                  continue

              source_file = os.path.join("extracted", source)

              if not os.path.isfile(source_file):
                  matches = glob.glob(
                      os.path.join("extracted", "**", source),
                      recursive=True
                  )

                  if matches:
                      source_file = matches[0]

              if not os.path.isfile(source_file):
                  print("MISSING:", source)
                  continue

              clean_route = route.strip("/")

              if clean_route:
                  destination = os.path.join(
                      "site",
                      clean_route,
                      "index.html"
                  )
              else:
                  destination = os.path.join(
                      "site",
                      "index.html"
                  )

              os.makedirs(os.path.dirname(destination), exist_ok=True)

              shutil.copy2(source_file, destination)

              count += 1
              print("BUILT:", route)

          print("TOTAL SCREENS BUILT:", count)

          if count < 60:
              raise SystemExit(
                  f"Build stopped: only {count} screens were created"
              )
          PY

      - name: Set home page
        run: |
          if [ -f "site/home/index.html" ]; then
            cp "site/home/index.html" "site/index.html"
          else
            echo "Home screen not found"
            exit 1
          fi

      - name: Preserve 404
        run: |
          if [ -f "404.html" ]; then
            cp "404.html" "site/404.html"
          fi

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
