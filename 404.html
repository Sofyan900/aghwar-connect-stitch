<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Aghwar Connect</title></head><body><script>
(function(){
  var p=window.location.pathname;
  var q=window.location.search;
  var base=p.substring(0,p.lastIndexOf('/')+1);
  window.location.replace(base+'#'+p+q);
})();
</script></body></html>
