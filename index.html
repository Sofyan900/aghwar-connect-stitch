<!DOCTYPE html>

<html dir="rtl" lang="ar"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Aghwar Connect - الأغوار تجمعنا | منصة مجتمع وادي الأردن</title>
<!-- Google Fonts: Readex Pro -->
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Readex+Pro:wght@300;400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<!-- Tailwind CSS -->
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<!-- Supabase JS Client Standard SDK -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<!-- React & Babel for Runtime Execution -->
<script src="https://cdn.jsdelivr.net/npm/react@18/umd/react.production.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@babel/standalone/babel.min.js"></script>
<script>
    tailwind.config = {
      darkMode: "class",
      theme: {
        extend: {
          fontFamily: {
            sans: ['"Readex Pro"', 'sans-serif'],
          },
          colors: {
            brand: {
              sky: '#0284c7',
              emerald: '#16a34a',
              dark: '#0f172a'
            }
          }
        }
      }
    }
  </script>
<style>
    body {
      font-family: 'Readex Pro', sans-serif;
      background-color: #faf8ff;
      user-select: none;
    }
    input, textarea, select {
      user-select: auto;
    }
    .custom-scrollbar::-webkit-scrollbar {
      width: 4px;
      height: 4px;
    }
    .custom-scrollbar::-webkit-scrollbar-thumb {
      background: #cbd5e1;
      border-radius: 4px;
    }
  </style>
</head>
<body class="bg-[#faf8ff] text-slate-900 antialiased selection:bg-sky-100">
<div id="root"></div>
<script type="text/babel">
    const { useState, useEffect, useMemo, useRef } = React;

    // ============================================================================
    // 1. CONFIGURATION, ROLES & REGIONS
    // ============================================================================
    const ROLES = {
      GUEST: 'guest',
      CITIZEN: 'citizen',
      FARMER: 'farmer',
      TECHNICIAN: 'technician',
      MERCHANT: 'merchant',
      RADIO_BROADCASTER: 'radio_broadcaster',
      FIELD_STREAMER: 'field_live_streamer',
      ADMIN_MODERATOR: 'content_moderator',
      PLATFORM_OWNER: 'platform_owner',
    };

    const REGIONS = [
      { id: 'south_aghwar', name: 'الأغوار الجنوبية', details: 'غور الصافي، فيفا، المعمورة', icon: '🌾' },
      { id: 'deir_alla', name: 'دير علا ومعدي', details: 'دير علا، معدي، العارضة', icon: '🌿' },
      { id: 'shuna', name: 'الشونة الجنوبية والشمالية', details: 'الشونة، الكرامة، الروضة', icon: '🌴' },
    ];

    const CANONICAL_SECTIONS = [
      { id: 'farmers', label: 'المزارعون والمحاصيل', icon: '🌱', desc: 'عروض الخضار والتمور والحمضيات' },
      { id: 'shops', label: 'المحلات والمطاعم', icon: '🏪', desc: 'دليل المحلات والتموين والخدمات التجارية' },
      { id: 'technicians', label: 'الفنيون والصيانة الميدانية', icon: '🛠️', desc: 'سباكة، شبكات ري، كهرباء، صيانة مضخات' },
      { id: 'classifieds', label: 'سوق المستعمل والإعلانات', icon: '📢', desc: 'بيع وشراء معدات، سيارات، وأثاث' },
      { id: 'directory', label: 'دليل الطوارئ وجهات الاتصال', icon: '📞', desc: 'أرقام الطوارئ، المستشفيات، سلطة الوادي' },
      { id: 'radio', label: 'إذاعة صوت الأغوار', icon: '🎙️', desc: 'البث الإذاعي المجتمعي والمداخلات' },
      { id: 'community', label: 'مجتمع ومنشورات الأغوار', icon: '👥', desc: 'تواصل أهالي وادي الأردن والقصص' },
      { id: 'events', label: 'الأخبار والفعاليات', icon: '📅', desc: 'مهرجانات التمور وأخبار الموسم الزراعي' },
    ];

    // ============================================================================
    // 2. SUPABASE AUTH & REAL CLIENT INITIALIZATION
    // ============================================================================
    const DEFAULT_SUPABASE_URL = 'https://hfpsxkmdmczcsnvlnvde.supabase.co';
    const DEFAULT_SUPABASE_ANON_KEY = 'sb_publishable_qiDesnRZWrwDlX20ec8LvA_pp88t-ka';

    // تحميل الإعدادات المحفوظة محلياً أو الافتراضية
    const getStoredSupabaseConfig = () => {
      try {
        const storedUrl = localStorage.getItem('AGHWAR_SUPABASE_URL');
        const storedAnon = localStorage.getItem('AGHWAR_SUPABASE_ANON_KEY');
        return {
          url: storedUrl || DEFAULT_SUPABASE_URL,
          anonKey: storedAnon || DEFAULT_SUPABASE_ANON_KEY,
          isCustom: !!(storedUrl && storedAnon)
        };
      } catch (e) {
        return { url: DEFAULT_SUPABASE_URL, anonKey: DEFAULT_SUPABASE_ANON_KEY, isCustom: false };
      }
    };

    let supabaseInstance = null;
    const initSupabaseClient = (url, anonKey) => {
      try {
        if (window.supabase && typeof window.supabase.createClient === 'function') {
          return window.supabase.createClient(url, anonKey, {
            auth: {
              persistSession: true,
              autoRefreshToken: true,
              detectSessionInUrl: false,
              flowType: 'pkce'
            }
          });
        }
      } catch (err) {
        console.error('Supabase init error:', err);
      }
      return null;
    };

    // ============================================================================
    // 3. MAIN APPLICATION RUNTIME
    // ============================================================================
    function AghwarConnectApp() {
      // إعدادات العميل
      const [supabaseConfig, setSupabaseConfig] = useState(getStoredSupabaseConfig());
      const [supabaseClient, setSupabaseClient] = useState(() => initSupabaseClient(supabaseConfig.url, supabaseConfig.anonKey));
      const [showConfigModal, setShowConfigModal] = useState(false);
      const [customUrlInput, setCustomUrlInput] = useState(supabaseConfig.url);
      const [customKeyInput, setCustomKeyInput] = useState(supabaseConfig.anonKey);

      // حالة المصادقة الرسمية (Supabase Auth State)
      const [sessionUser, setSessionUser] = useState(null);
      const [authLoading, setAuthLoading] = useState(true);
      const [authMode, setAuthMode] = useState('login'); // 'login' | 'signup' | 'reset'
      
      // حقول الاستمارة
      const [formEmail, setFormEmail] = useState('citizen@aghwar.jo');
      const [formPassword, setFormPassword] = useState('password123');
      const [formFullName, setFormFullName] = useState('محمود العدوان');
      const [authSubmitting, setAuthSubmitting] = useState(false);

      // حالة التطبيق العامة
      const [currentRole, setCurrentRole] = useState(ROLES.CITIZEN);
      const [currentRegion, setCurrentRegion] = useState('south_aghwar');
      const [deviceMode, setDeviceMode] = useState('mobile');
      // Route state: preserve the screen on refresh/direct links.
      const ROUTABLE_PATHS = useMemo(() => new Set([
        '/home','/auth/login','/account','/farmers','/technicians','/radio','/directory',
        '/admin','/forbidden','/tower-ad','/community','/classifieds','/events','/shops'
      ]), []);
      const getInitialRoute = () => {
        const hashPath = window.location.hash && window.location.hash.startsWith('#/')
          ? window.location.hash.slice(1).split('?')[0] : '';
        const path = hashPath || window.location.pathname;
        return ROUTABLE_PATHS.has(path) ? path : '/home';
      };
      const [currentRoute, setCurrentRoute] = useState(getInitialRoute);
      const [routeParams, setRouteParams] = useState({});

      // الإذاعة الحية
      const [isRadioPlaying, setIsRadioPlaying] = useState(false);
      const [callInQueueStatus, setCallInQueueStatus] = useState('idle');

      // رسائل النظام التفاعلية
      const [toastMessage, setToastMessage] = useState(null);
      const showToast = (msg) => {
        setToastMessage(msg);
        setTimeout(() => setToastMessage(null), 3500);
      };

      // Keep browser back/forward navigation synchronized with the visible screen.
      useEffect(() => {
        const syncRoute = () => {
          const hashPath = window.location.hash && window.location.hash.startsWith('#/')
            ? window.location.hash.slice(1).split('?')[0] : '';
          const path = hashPath || window.location.pathname;
          if (ROUTABLE_PATHS.has(path)) setCurrentRoute(path);
        };
        window.addEventListener('popstate', syncRoute);
        window.addEventListener('hashchange', syncRoute);
        return () => {
          window.removeEventListener('popstate', syncRoute);
          window.removeEventListener('hashchange', syncRoute);
        };
      }, [ROUTABLE_PATHS]);

      useEffect(() => {
        if (!supabaseClient) { setAuthLoading(false); return; }
        let cancelled = false;
        const finishOAuthCallback = async () => {
          try {
            const url = new URL(window.location.href);
            const code = url.searchParams.get('code');
            const flowId = url.searchParams.get('sb_flow_id');
            const oauthError = url.searchParams.get('error');
            const oauthErrorDescription = url.searchParams.get('error_description');
            if (oauthError) {
              const message = oauthErrorDescription || oauthError;
              showToast(`❌ فشل تسجيل الدخول عبر Google: ${message}`);
              ['error','error_code','error_description','state'].forEach(k => url.searchParams.delete(k));
              window.history.replaceState({}, '', url.pathname + (url.search ? url.search : '') + url.hash);
            } else if (code) {
              const { error: exchangeError } = await supabaseClient.auth.exchangeCodeForSession(
                code,
                flowId ? { flowId } : undefined
              );
              if (exchangeError) throw exchangeError;
              url.searchParams.delete('code'); url.searchParams.delete('state');
              window.history.replaceState({}, '', url.pathname + (url.search ? url.search : '') + url.hash);
            }
            const { data: { session }, error: sessionError } = await supabaseClient.auth.getSession();
            if (sessionError) throw sessionError;
            if (!cancelled && session?.user) {
              setSessionUser(session.user);
              if (window.location.pathname === '/auth/login') { window.history.replaceState({}, '', '/home'); setCurrentRoute('/home'); }
              setCurrentRole(session.user.user_metadata?.role || ROLES.CITIZEN);
            } else if (!cancelled) setSessionUser(null);
          } catch (err) {
            console.error('Supabase OAuth callback processing error:', err);
            if (!cancelled) showToast(`❌ تعذر إكمال تسجيل الدخول: ${err?.message || 'خطأ غير معروف'}`);
          } finally { if (!cancelled) setAuthLoading(false); }
        };
        finishOAuthCallback();
        const { data: { subscription } } = supabaseClient.auth.onAuthStateChange((event, session) => {
          if (session?.user) {
            setSessionUser(session.user);
            if (window.location.pathname === '/auth/login') { window.history.replaceState({}, '', '/home'); setCurrentRoute('/home'); }
            setCurrentRole(session.user.user_metadata?.role || ROLES.CITIZEN);
          } else { setSessionUser(null); if (event === 'SIGNED_OUT') setCurrentRole(ROLES.GUEST); }
        });
        return () => { cancelled = true; subscription?.unsubscribe(); };
      }, [supabaseClient]);

      // تحديث مفاتيح Supabase المخصصة
      const handleSaveSupabaseConfig = (e) => {
        e.preventDefault();
        try {
          localStorage.setItem('AGHWAR_SUPABASE_URL', customUrlInput.trim());
          localStorage.setItem('AGHWAR_SUPABASE_ANON_KEY', customKeyInput.trim());
          const newClient = initSupabaseClient(customUrlInput.trim(), customKeyInput.trim());
          setSupabaseClient(newClient);
          setSupabaseConfig({
            url: customUrlInput.trim(),
            anonKey: customKeyInput.trim(),
            isCustom: true
          });
          setShowConfigModal(false);
          showToast('✅ تم تحديث وربط عميل Supabase بنجاح');
        } catch (err) {
          showToast('❌ تعذر حفظ المفاتيح: ' + err.message);
        }
      };

      // --------------------------------------------------------------------------
      // دوال المصادقة الأساسية (Real Supabase Auth Implementations)
      // --------------------------------------------------------------------------
      
      // 1. تسجيل الدخول بكلمة المرور
      const handleSignIn = async (e) => {
        if (e) e.preventDefault();
        setAuthSubmitting(true);
        try {
          if (!supabaseClient) throw new Error('عميل Supabase غير مهيأ');
          
          const { data, error } = await supabaseClient.auth.signInWithPassword({
            email: formEmail.trim(),
            password: formPassword
          });

          if (error) {
            throw error;
          }

          if (data?.user) {
            setSessionUser(data.user);
            const userRole = data.user.user_metadata?.role || ROLES.CITIZEN;
            setCurrentRole(userRole);
            showToast(`مرحباً بك مجدداً ${data.user.user_metadata?.full_name || data.user.email} 🌾`);
            const destination = routeParams.redirect || '/home';
            navigate(destination);
          }
        } catch (err) {
          showToast(`❌ فشل تسجيل الدخول: ${err.message || 'بيانات الاعتماد غير صالحة'}`);
        } finally {
          setAuthSubmitting(false);
        }
      };

      // 2. إنشاء حساب جديد مع تثبيت دور 'citizen' الافتراضي ومنع الصلاحيات الإدارية
      const handleSignUp = async (e) => {
        if (e) e.preventDefault();
        setAuthSubmitting(true);
        try {
          if (!supabaseClient) throw new Error('عميل Supabase غير مهيأ');

          const { data, error } = await supabaseClient.auth.signUp({
            email: formEmail.trim(),
            password: formPassword,
            options: {
              data: {
                full_name: formFullName.trim(),
                role: 'citizen', // منع منح صلاحية إدارية تلقائياً
                registered_basin: currentRegion
              }
            }
          });

          if (error) {
            throw error;
          }

          if (data?.user) {
            setSessionUser(data.user);
            setCurrentRole(ROLES.CITIZEN);
            showToast('✅ تم إنشاء حسابك كمواطن في أغوار كونكت بنجاح');
            const destination = routeParams.redirect || '/home';
            navigate(destination);
          }
        } catch (err) {
          showToast(`❌ تعذر إنشاء الحساب: ${err.message}`);
        } finally {
          setAuthSubmitting(false);
        }
      };

      // 3. استعادة كلمة المرور
      const handleResetPassword = async (e) => {
        if (e) e.preventDefault();
        setAuthSubmitting(true);
        try {
          if (!supabaseClient) throw new Error('عميل Supabase غير مهيأ');

          const { error } = await supabaseClient.auth.resetPasswordForEmail(formEmail.trim(), {
            redirectTo: window.location.origin + '/auth/reset-callback',
          });

          if (error) throw error;
          showToast('📧 تم إرسال رابط إعادة تعيين كلمة المرور إلى بريدك الإلكتروني');
          setAuthMode('login');
        } catch (err) {
          showToast(`⚠️ ملاحظة استعادة المرور: ${err.message || 'تم قبول الطلب للبريد المسجل'}`);
        } finally {
          setAuthSubmitting(false);
        }
      };

      // 4. تسجيل الخروج الفعلي
      const handleSignOut = async () => {
        try {
          if (supabaseClient) {
            await supabaseClient.auth.signOut();
          }
        } catch (err) {
          console.warn('Sign out warning:', err);
        }
        setSessionUser(null);
        setCurrentRole(ROLES.GUEST);
        showToast('🚪 تم تسجيل الخروج بنجاح والتحويل لصفة زائر');
        navigate('/home');
      };

      // 5. تسجيل الدخول عبر Google OAuth — إنتاجي فقط، بلا محاكاة أو fallback
      const handleGoogleOAuth = async () => {
        setAuthSubmitting(true);
        try {
          if (!supabaseClient) throw new Error('عميل Supabase غير مهيأ');

          const redirectTo = `${window.location.origin}/auth/login`;
          const { error } = await supabaseClient.auth.signInWithOAuth({
            provider: 'google',
            options: {
              redirectTo,
              queryParams: { access_type: 'offline', prompt: 'select_account' }
            }
          });

          if (error) throw error;
          // Supabase ينفذ إعادة التوجيه تلقائياً عند نجاح بدء OAuth.
        } catch (err) {
          console.error('Google OAuth error:', err);
          showToast(`❌ تعذر بدء تسجيل الدخول عبر Google: ${err?.message || 'تحقق من إعداد Google في Supabase'}`);
        } finally {
          setAuthSubmitting(false);
        }
      };

      // حارس التنقل والأمان (Route Guard)
      const navigate = (route, params = {}) => {
        // حماية الإجراءات التفاعلية: تحويل الزائر لصفحة الدخول مع حفظ مسار العودة
        if (currentRole === ROLES.GUEST && (route === '/create' || route === '/cart/checkout' || route === '/radio/call-in' || route === '/account')) {
          showToast('⚠️ يتطلب هذا الإجراء تسجيل الدخول أولاً');
          setRouteParams({ redirect: route });
          setCurrentRoute('/auth/login');
          return;
        }

        // حماية لوحة الإشراف المركزية
        if (route.startsWith('/admin')) {
          if (currentRole !== ROLES.PLATFORM_OWNER && currentRole !== ROLES.ADMIN_MODERATOR) {
            showToast('🚫 403 Forbidden: هذا المسار مخصص للمشرفين والمالك فقط');
            setCurrentRoute('/forbidden');
            return;
          }
        }

        // حماية استوديو الإذاعة
        if (route === '/radio/studio') {
          if (currentRole !== ROLES.PLATFORM_OWNER && currentRole !== ROLES.RADIO_BROADCASTER) {
            showToast('🚫 403: استوديو الإذاعة مخصص للمذيعين المعتمدين');
            setCurrentRoute('/forbidden');
            return;
          }
        }

        setCurrentRoute(route);
        setRouteParams(params);
        // Keep the address bar synchronized without reloading the page.
        if (window.location.pathname !== route) {
          window.history.pushState({}, '', route);
        }
        window.scrollTo(0, 0);
      };

      const currentRegionName = useMemo(() => {
        return REGIONS.find(r => r.id === currentRegion)?.name || 'الأغوار الجنوبية';
      }, [currentRegion]);

      return (
        <div className="min-h-screen bg-[#faf8ff] text-slate-900 font-sans text-right" dir="rtl">
          
          {/* ========================================================================= */}
          {/* TOP STATUS & SUPABASE INTEGRATION BAR                                      */}
          {/* ========================================================================= */}
          <div className="bg-slate-900 text-white text-xs px-3 sm:px-6 py-2 border-b border-slate-800 flex flex-wrap items-center justify-between gap-2 shadow-inner sticky top-0 z-50">
            <div className="flex items-center gap-2 flex-wrap">
              <span className="w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></span>
              <span className="font-bold tracking-wide">Aghwar Connect Runtime</span>
              
              {/* شارة Supabase Auth المتصل */}
              <span className="text-[10px] bg-emerald-950/80 text-emerald-300 border border-emerald-700/60 px-2 py-0.5 rounded-full flex items-center gap-1 font-mono">
                <span>⚡ Supabase Auth: {sessionUser ? 'جلسة نشطة' : 'وضع الزائر'}</span>
              </span>

              {/* زر إعدادات الربط المباشر */}
              <button
                onClick={() => setShowConfigModal(true)}
                className="text-[10px] bg-slate-800 hover:bg-slate-700 text-slate-300 hover:text-white px-2 py-0.5 rounded border border-slate-700 transition-colors"
                title="تخصيص مفاتيح Supabase الحقيقية"
              >
                ⚙️ إعدادات Supabase {supabaseConfig.isCustom && '(مفتاح مخصص)'}
              </button>
            </div>

            {/* محاكي الأدوار والصلاحيات وتبديل العرض */}
            <div className="flex items-center gap-2 flex-wrap">
              <span className="text-slate-400 text-[11px]">الدور:</span>
              <select
                value={currentRole}
                onChange={(e) => {
                  const val = e.target.value;
                  setCurrentRole(val);
                  showToast(`تم تبديل الدور إلى: ${val}`);
                }}
                className="bg-slate-800 border border-slate-700 text-white text-[11px] rounded-lg px-2 py-1 focus:outline-none cursor-pointer"
              >
                <option value={ROLES.CITIZEN}>مواطن مسجل (Citizen)</option>
                <option value={ROLES.GUEST}>زائر غير مسجل (Guest)</option>
                <option value={ROLES.FARMER}>مزارع موثق (Farmer)</option>
                <option value={ROLES.TECHNICIAN}>فني صيانة (Technician)</option>
                <option value={ROLES.RADIO_BROADCASTER}>مذيع إذاعة (Broadcaster)</option>
                <option value={ROLES.ADMIN_MODERATOR}>مشرف محتوى (Moderator)</option>
                <option value={ROLES.PLATFORM_OWNER}>مالك المنصة (Platform Owner)</option>
              </select>

              {/* محاكي الشاشة */}
              <div className="flex items-center bg-slate-800 border border-slate-700 rounded-lg p-0.5 mr-1">
                <button
                  onClick={() => setDeviceMode('mobile')}
                  className={`px-2 py-0.5 rounded text-[11px] font-bold transition-all ${deviceMode === 'mobile' ? 'bg-sky-600 text-white' : 'text-slate-400 hover:text-white'}`}
                >
                  📱 موبايل
                </button>
                <button
                  onClick={() => setDeviceMode('desktop')}
                  className={`px-2 py-0.5 rounded text-[11px] font-bold transition-all ${deviceMode === 'desktop' ? 'bg-sky-600 text-white' : 'text-slate-400 hover:text-white'}`}
                >
                  🖥️ مكتبي
                </button>
              </div>
            </div>
          </div>

          {/* Toast Notification Container */}
          {toastMessage && (
            <div className="fixed top-12 left-1/2 -translate-x-1/2 z-50 bg-slate-900/95 text-white backdrop-blur-md border border-slate-700 px-4 py-2.5 rounded-2xl text-xs font-semibold shadow-2xl transition-all animate-bounce flex items-center gap-2 max-w-sm text-center">
              <span>{toastMessage}</span>
            </div>
          )}

          {/* ========================================================================= */}
          {/* MODAL: SUPABASE CONFIGURATION (ضبط مفاتيح الربط الحقيقي)                 */}
          {/* ========================================================================= */}
          {showConfigModal && (
            <div className="fixed inset-0 z-50 bg-black/60 backdrop-blur-xs flex items-center justify-center p-4">
              <div className="bg-white rounded-2xl max-w-md w-full p-5 border border-slate-200 shadow-2xl space-y-4 text-right">
                <div className="flex items-center justify-between border-b border-slate-100 pb-3">
                  <div className="flex items-center gap-2">
                    <span className="text-xl">⚡</span>
                    <h3 className="text-sm font-bold text-slate-900">إعدادات اتصال Supabase القياسي</h3>
