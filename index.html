<script>

/* =========================================================
   1. Supabase - Safe Initialization
   ========================================================= */

const SUPABASE_URL =
  'https://hfpsxkmdmczcsnvlnvde.supabase.co';

const SUPABASE_ANON =
  'sb_publishable_qiDesnRZWrwDlX20ec8LvA_pp88t-ka';

let supabase = null;

try {

  if (
    window.supabase &&
    typeof window.supabase.createClient === 'function'
  ) {

    supabase =
      window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_ANON
      );

  }

} catch (error) {

  console.error(
    'Supabase initialization failed:',
    error
  );

}


/* =========================================================
   2. Global State
   ========================================================= */

let currentUser = null;

let currentRegion =
  'الأغوار الجنوبية';

let radioPlaying = false;


/* =========================================================
   3. Navigation
   ========================================================= */

function navigateTo(route) {

  window.location.hash =
    '#/' + route;

}


function getRoute() {

  const hash =
    window.location.hash || '#/home';

  return (
    hash
      .replace(/^#\/?/, '')
      .trim() || 'home'
  );

}


/* =========================================================
   4. Header Authentication UI
   ========================================================= */

function updateAuthUI() {

  const container =
    document.getElementById(
      'authHeaderAction'
    );

  if (!container) return;

  if (currentUser) {

    const name =
      currentUser.user_metadata?.full_name ||
      currentUser.email?.split('@')[0] ||
      'مستخدم';

    const firstLetter =
      name.charAt(0).toUpperCase();

    container.innerHTML = `

      <div class="flex items-center gap-1.5">

        <button
          onclick="navigateTo('profile')"
          class="flex items-center gap-1.5 bg-slate-100 hover:bg-slate-200 px-2.5 py-1 rounded-xl text-[11px] font-bold text-slate-800 transition-colors"
        >

          <span class="w-5 h-5 rounded-full bg-emerald-600 text-white flex items-center justify-center text-[10px] font-bold">
            ${firstLetter}
          </span>

          <span class="truncate max-w-[80px]">
            ${name}
          </span>

        </button>

        <button
          onclick="handleSignOut()"
          class="p-1.5 text-slate-400 hover:text-rose-600 rounded-lg text-xs"
          title="خروج"
        >
          🚪
        </button>

      </div>

    `;

  } else {

    container.innerHTML = `

      <button
        onclick="navigateTo('auth')"
        class="bg-sky-600 hover:bg-sky-700 text-white text-[11px] font-bold px-3 py-1.5 rounded-xl shadow-xs transition-all thumb-btn flex items-center gap-1"
      >
        <span>دخول</span>
      </button>

    `;

  }

}


/* =========================================================
   5. Authentication
   ========================================================= */

async function handleGoogleLogin(e) {

  if (e) e.preventDefault();

  if (!supabase) {

    alert(
      'خدمة تسجيل الدخول غير متاحة حاليًا. حاول مرة أخرى.'
    );

    return;
  }

  try {

    const { error } =
      await supabase.auth.signInWithOAuth({

        provider: 'google',

        options: {

          redirectTo:
            window.location.origin +
            window.location.pathname

        }

      });

    if (error) throw error;

  } catch (err) {

    alert(
      'خطأ أثناء بدء تسجيل الدخول بجوجل: ' +
      (err.message || 'خطأ غير معروف')
    );

  }

}


async function handleEmailLogin(e) {

  e.preventDefault();

  if (!supabase) {

    alert(
      'خدمة تسجيل الدخول غير متاحة حاليًا. حاول مرة أخرى.'
    );

    return;
  }

  const email =
    document.getElementById(
      'loginEmail'
    )?.value || '';

  const pass =
    document.getElementById(
      'loginPassword'
    )?.value || '';

  const errorBox =
    document.getElementById(
      'authError'
    );

  if (errorBox) {

    errorBox.classList.add(
      'hidden'
    );

  }

  try {

    const { data, error } =
      await supabase.auth.signInWithPassword({

        email: email,

        password: pass

      });

    if (error) throw error;

    currentUser =
      data?.user || null;

    updateAuthUI();

    navigateTo('home');

  } catch (err) {

    if (errorBox) {

      errorBox.textContent =
        err.message ||
        'تعذر تسجيل الدخول';

      errorBox.classList.remove(
        'hidden'
      );

    }

  }

}


async function handleEmailSignUp(e) {

  e.preventDefault();

  if (!supabase) {

    alert(
      'خدمة التسجيل غير متاحة حاليًا. حاول مرة أخرى.'
    );

    return;
  }

  const name =
    document.getElementById(
      'regName'
    )?.value || '';

  const email =
    document.getElementById(
      'regEmail'
    )?.value || '';

  const pass =
    document.getElementById(
      'regPassword'
    )?.value || '';

  const category =
    document.getElementById(
      'regCategory'
    )?.value || '';

  const specialty =
    document.getElementById(
      'regSpecialty'
    )?.value || '';

  const region =
    document.getElementById(
      'regRegion'
    )?.value || '';

  const errorBox =
    document.getElementById(
      'authError'
    );

  if (errorBox) {

    errorBox.classList.add(
      'hidden'
    );

  }

  try {

    const { data, error } =
      await supabase.auth.signUp({

        email: email,

        password: pass,

        options: {

          data: {

            full_name: name,

            category: category,

            specialty: specialty,

            region: region

          }

        }

      });

    if (error) throw error;

    alert(
      'تم إنشاء الحساب بنجاح! يرجى التحقق من بريدك إذا طُلب التأكيد.'
    );

    currentUser =
      data?.user || null;

    updateAuthUI();

    navigateTo('home');

  } catch (err) {

    if (errorBox) {

      errorBox.textContent =
        err.message ||
        'تعذر إنشاء الحساب';

      errorBox.classList.remove(
        'hidden'
      );

    }

  }

}


async function handleSignOut() {

  if (supabase) {

    try {

      await supabase.auth.signOut();

    } catch (error) {

      console.warn(
        'Sign out error:',
        error
      );

    }

  }

  currentUser = null;

  updateAuthUI();

  navigateTo('home');

}


/* =========================================================
   6. Registration Specialties
   ========================================================= */

function updateRegistrationSpecialties() {

  const cat =
    document.getElementById(
      'regCategory'
    )?.value;

  const specSelect =
    document.getElementById(
      'regSpecialty'
    );

  if (!specSelect) return;

  const specialties = {

    user: [

      'تاجر',
      'حلاق',
      'مواسيرجي',
      'عامل بناء',
      'نجار',
      'دهان',
      'بلاط وديكور',
      'عامل نظافة',
      'سائق / نقل',
      'كوافيرة',
      'طباخ / خدمات طعام',
      'خياط',
      'مصور / صانع محتوى'

    ],

    farmer: [

      'مزارع'

    ],

    technician: [

      'فني صيانة',
      'كهربائي',
      'ميكانيكي سيارات',
      'فني تكييف وتبريد',
      'فني صيانة أجهزة وهواتف',
      'فني كمبيوتر'

    ]

  };

  const list =
    specialties[cat] || [];

  specSelect.innerHTML =
    '<option value="">اختر التخصص</option>' +

    list
      .map(item =>
        `<option value="${item}">${item}</option>`
      )
      .join('');

}


/* =========================================================
   7. Radio
   ========================================================= */

function toggleRadio() {

  radioPlaying =
    !radioPlaying;

  const btn =
    document.getElementById(
      'radioPlayBtn'
    );

  const wave =
    document.getElementById(
      'radioWave'
    );

  if (btn) {

    btn.textContent =
      radioPlaying
        ? '⏸ إيقاف مؤقت'
        : '▶ تشغيل البث';

  }

  if (wave) {

    wave.style.opacity =
      radioPlaying
        ? '1'
        : '0.2';

  }

}
