<body>
  <div class="app-frame">

        </button>

        <div class="flex items-center gap-2">
          <button
            type="button"
            onclick="navigateTo('home')"

    <main id="appViewport">

            جاري تحميل الأغوار كونكت...

    </main>

    <nav class="fixed bottom-0 left-0 right-0 z-50 border-t border-slate-200 bg-white/95 backdrop-blur">
      <div class="mx-auto grid max-w-[768px] grid-cols-5">

        <button
          type="button"
          data-route="home"

        <button

        <button

        >

            +

        <button

        </button>

        <button

        </button>

      </div>

  </div>

  <script>
    /* =========================
       Supabase
       ========================= */

    const SUPABASE_URL =
      'https://hfpsxkmdmczcsnvlnvde.supabase.co';

    const SUPABASE_ANON =
      'sb_publishable_qiDesnRZWrwDlX20ec8LvA_pp88t-ka';

    /*
      مهم:
      لا نفترض أن Supabase جاهز.
      التطبيق يجب أن يعمل ويعرض الصفحات حتى لو تعذر تحميل Supabase.
    */
    let supabase = null;

    try {
      if (
        window.supabase &&
        typeof window.supabase.createClient === 'function'
      ) {
        supabase = window.supabase.createClient(
          SUPABASE_URL,
          SUPABASE_ANON
        );
      }
    } catch (error) {
      console.error(
        'Supabase initialization failed:',
        error
      );
    }

    /* =========================
       Global state
       ========================= */

    let currentUser = null;
    let currentRegion = 'الأغوار الجنوبية';
    let radioPlaying = false;

    /* =========================
       Navigation
       ========================= */

    function normalizeHash(hash) {
      return String(hash || '')
        .replace(/^#/, '')
        .replace(/^\/+/, '')
        .replace(/\/+$/, '');
    }

    function getRoute() {
      return normalizeHash(window.location.hash);
    }

    function navigateTo(path) {
      const cleanPath = String(path || 'home')
        .replace(/^#/, '')
        .replace(/^\/+/, '');

      window.location.hash = cleanPath || 'home';
    }

    /* =========================
       Auth UI
       ========================= */

    function updateAuthUI() {
      const button =
        document.getElementById('headerAuthButton');

      if (!button) return;

      if (currentUser) {
        button.textContent = 'حسابي';
        button.onclick = function () {
          navigateTo('profile');
        };
      } else {
        button.textContent = 'دخول';
        button.onclick = function () {
          navigateTo('auth');
        };
      }
    }

    /* =========================
       Google Login
       ========================= */

    async function handleGoogleLogin(e) {
      if (e) e.preventDefault();

      if (!supabase) {
        alert(
          'خدمة تسجيل الدخول غير متاحة حاليًا. حاول مرة أخرى.'
        );
        return;
      }

      try {
        const { error } =
          await supabase.auth.signInWithOAuth({
            provider: 'google',
            options: {
              redirectTo:
                window.location.origin +
                window.location.pathname
            }
          });

        if (error) throw error;

      } catch (err) {
        alert(
          'خطأ أثناء بدء تسجيل الدخول بجوجل: ' +
          (err.message || 'خطأ غير معروف')
        );
      }
    }

    /* =========================
       Email Login
       ========================= */

    async function handleEmailLogin(e) {
      if (e) e.preventDefault();

      if (!supabase) {
        alert(
          'خدمة تسجيل الدخول غير متاحة حاليًا. حاول مرة أخرى.'
        );
        return;
      }

      const emailInput =
        document.getElementById('loginEmail');

      const passwordInput =
        document.getElementById('loginPassword');

      const email =
        emailInput ? emailInput.value.trim() : '';

      const password =
        passwordInput ? passwordInput.value : '';

      if (!email || !password) {
        alert('يرجى إدخال البريد الإلكتروني وكلمة المرور.');
        return;
      }

      try {
        const { data, error } =
          await supabase.auth.signInWithPassword({
            email,
            password
          });

        if (error) throw error;

        currentUser =
          data && data.user
            ? data.user
            : null;

        updateAuthUI();
        navigateTo('home');

      } catch (err) {
        alert(
          'تعذر تسجيل الدخول: ' +
          (err.message || 'خطأ غير معروف')
        );
      }
    }

    /* =========================
       Registration specialties
       ========================= */

    function updateRegistrationSpecialties() {
      const category =
        document.getElementById('regCategory');

      const specialty =
        document.getElementById('regSpecialty');

      if (!category || !specialty) return;

      const cat = category.value;

      const userSpecialties = [
        'تاجر',
        'حلاق',
        'مواسيرجي',
        'عامل بناء',
        'نجار',
        'دهان',
        'بلاط وديكور',
        'عامل نظافة',
        'سائق / نقل',
        'كوافيرة',
        'طباخ / خدمات طعام',
        'خياط',
        'مصور / صانع محتوى'
      ];

      const technicianSpecialties = [
        'فني صيانة',
        'كهربائي',
        'ميكانيكي سيارات',
        'فني تكييف وتبريد',
        'فني صيانة أجهزة وهواتف',
        'فني كمبيوتر'
      ];

      const farmerSpecialties = [
        'مزارع'
      ];

      let list = [];

      if (cat === 'user') {
        list = userSpecialties;
      } else if (cat === 'technician') {
        list = technicianSpecialties;
      } else if (cat === 'farmer') {
        list = farmerSpecialties;
      }

      specialty.innerHTML =
        '<option value="">اختر التخصص</option>' +
        list.map(function (item) {
          return (
            '<option value="' +
            escapeHtml(item) +
            '">' +
            escapeHtml(item) +
            '</option>'
          );
        }).join('');
    }

    /* =========================
       Email Sign Up
       ========================= */

    async function handleEmailSignUp(e) {
      if (e) e.preventDefault();

      if (!supabase) {
        alert(
          'خدمة تسجيل الدخول غير متاحة حاليًا. حاول مرة أخرى.'
        );
        return;
      }

      const name =
        document.getElementById('regName')?.value.trim() || '';

      const category =
        document.getElementById('regCategory')?.value || '';

      const specialty =
        document.getElementById('regSpecialty')?.value || '';

      const region =
        document.getElementById('regRegion')?.value || '';

      const email =
        document.getElementById('regEmail')?.value.trim() || '';

      const password =
        document.getElementById('regPassword')?.value || '';

      if (
        !name ||
        !category ||
        !specialty ||
        !region ||
        !email ||
        !password
      ) {
        alert('يرجى تعبئة جميع الحقول.');
        return;
      }

      try {
        const { data, error } =
          await supabase.auth.signUp({
            email,
            password,
            options: {
              data: {
                full_name: name,
                category,
                specialty,
                region
              }
            }
          });

        if (error) throw error;

        currentRegion = region;

        if (data && data.user) {
          currentUser = data.user;
        }

        updateAuthUI();

        alert(
          'تم إنشاء الحساب بنجاح. إذا طلب منك تأكيد البريد الإلكتروني، يرجى تأكيده ثم تسجيل الدخول.'
        );

        navigateTo('auth');

      } catch (err) {
        alert(
          'تعذر إنشاء الحساب: ' +
          (err.message || 'خطأ غير معروف')
        );
      }
    }

    /* =========================
       Sign out
       ========================= */

    async function handleSignOut() {
      if (supabase) {
        try {
          await supabase.auth.signOut();
        } catch (error) {
          console.warn(
            'Sign out error:',
            error
          );
        }
      }

      currentUser = null;
      updateAuthUI();
      navigateTo('home');
    }

    /* =========================
       Radio
       ========================= */

    function toggleRadio() {
      radioPlaying = !radioPlaying;

      const button =
        document.getElementById('radioToggleButton');

      const status =
        document.getElementById('radioStatus');

      if (button) {
        button.textContent =
          radioPlaying
            ? 'إيقاف'
            : 'تشغيل';
      }

      if (status) {
        status.textContent =
          radioPlaying
            ? 'إذاعة صوت الأغوار تعمل الآن'
            : 'اضغط تشغيل للاستماع';
      }
    }

    /* =========================
       Helpers
       ========================= */

    function escapeHtml(value) {
      return String(value ?? '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#039;');
    }

    function cardBase(extra) {
      return (
        'rounded-2xl border border-slate-200 bg-white shadow-sm ' +
        (extra || '')
      );
    }

    /* =========================
       Radio component
       ========================= */

    function renderRadioBar() {
      return `
        <div class="${cardBase('mb-4 overflow-hidden')}">
          <div class="flex items-center justify-between gap-3 p-4">
            <div class="flex min-w-0 items-center gap-3">
              <div class="flex h-11 w-11 shrink-0 items-center justify-center rounded-xl bg-sky-50 text-xl">
                📻
              </div>

              <div class="min-w-0">
                <div class="font-extrabold text-slate-800">
                  إذاعة صوت الأغوار
                </div>

                <div
                  id="radioStatus"
                  class="mt-1 truncate text-xs text-slate-500"
                >
                  ${
                    radioPlaying
                      ? 'إذاعة صوت الأغوار تعمل الآن'
                      : 'اضغط تشغيل للاستماع'
                  }
                </div>
              </div>
            </div>

            <button
              id="radioToggleButton"
              type="button"
              onclick="toggleRadio()"
              class="shrink-0 rounded-xl bg-sky-600 px-4 py-2 text-sm font-bold text-white"
            >
              ${radioPlaying ? 'إيقاف' : 'تشغيل'}
            </button>
          </div>
        </div>
      `;
    }

              <h1 class="text-xl font-extrabold">

              </p>

              <button

            </div>
          </section>

          ${renderRadioBar()}

          <section>

              </h2>
            </div>

            <div class="grid grid-cols-2 gap-3">

              <button
                type="button"
                onclick="navigateTo('farmers')"
                class="${cardBase('p-4 text-right')}"
              >
                <div class="mb-3 flex h-12 w-12 items-center justify-center rounded-2xl bg-green-50 text-2xl">
                  🌱
                </div>

                <div class="font-extrabold text-slate-800">
                  المزارعون
                </div>

                <div class="mt-1 text-xs leading-5 text-slate-500">

                </div>
              </button>

              <button
                type="button"
                onclick="navigateTo('shops')"
                class="${cardBase('p-4 text-right')}"

              </button>

              <button
                type="button"
                onclick="navigateTo('technicians')"
                class="${cardBase('p-4 text-right')}"
              >
                <div class="mb-3 flex h-12 w-12 items-center justify-center rounded-2xl bg-sky-50 text-2xl">
                  🛠️
                </div>

                <div class="font-extrabold text-slate-800">
                  فني الصيانة
                </div>

                <div class="mt-1 text-xs leading-5 text-slate-500">

              </button>

              <button
                type="button"
                onclick="navigateTo('classifieds')"

              >

                  🛍️
                </div>

                <div class="font-extrabold text-slate-800">

                </div>

              </button>

            </div>
          </section>

          <section class="${cardBase('p-4')}">
            <div class="flex items-center justify-between gap-3">
              <div>
                <div class="font-extrabold text-slate-800">
                  المجتمع
                </div>

                <div class="mt-1 text-xs leading-5 text-slate-500">
                  المنشورات والقصص والأصدقاء والرسائل والفعاليات.
                </div>
              </div>

              <button
                type="button"
                onclick="navigateTo('community')"
                class="rounded-xl bg-slate-100 px-4 py-2 text-sm font-bold text-slate-700"
              >
                دخول
              </button>
            </div>
          </section>

        </div>

    }

    /* =========================
       Community
       ========================= */

    function renderCommunityView() {
      return `
        <div class="space-y-4 px-4 py-4">

          <div>
            <h1 class="text-xl font-extrabold text-slate-800">

            >

              <div class="font-extrabold text-slate-800">

              </div>

          <button
