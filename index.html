<script>

const SUPABASE_URL = 'https://hfpsxkmdmczcsnvlnvde.supabase.co';
const SUPABASE_ANON = 'sb_publishable_qiDesnRZWrwDlX20ec8LvA_pp88t-ka';

const supabase = window.supabase.createClient(
  SUPABASE_URL,
  SUPABASE_ANON
);

let currentUser = null;
let currentRegion = 'الأغوار الجنوبية';

function navigateTo(route) {
  window.location.hash = '#/' + route;
}

function getRoute() {
  const hash = window.location.hash || '#/home';
  return hash.replace(/^#\/?/, '').trim() || 'home';
}

function updateAuthUI() {
  const container = document.getElementById('authHeaderAction');
  if (!container) return;

  if (currentUser) {
    const name =
      currentUser.user_metadata?.full_name ||
      currentUser.email.split('@')[0];

    container.innerHTML = `
      <div class="flex items-center gap-1.5">
        <button onclick="navigateTo('profile')" class="flex items-center gap-1.5 bg-slate-100 hover:bg-slate-200 px-2.5 py-1 rounded-xl text-[11px] font-bold text-slate-800 transition-colors">
          <span class="w-5 h-5 rounded-full bg-emerald-600 text-white flex items-center justify-center text-[10px] font-bold">
            ${name[0].toUpperCase()}
          </span>
          <span class="truncate max-w-[80px]">${name}</span>
        </button>

        <button onclick="handleSignOut()" class="p-1.5 text-slate-400 hover:text-rose-600 rounded-lg text-xs" title="خروج">
          🚪
        </button>
      </div>
    `;
  } else {
    container.innerHTML = `
      <button onclick="navigateTo('auth')" class="bg-sky-600 hover:bg-sky-700 text-white text-[11px] font-bold px-3 py-1.5 rounded-xl shadow-xs transition-all thumb-btn flex items-center gap-1">
        <span>دخول</span>
      </button>
    `;
  }
}

async function handleGoogleLogin(e) {
  if (e) e.preventDefault();

  try {
    const { data, error } =
      await supabase.auth.signInWithOAuth({
        provider: 'google',
        options: {
          redirectTo:
            window.location.origin +
            window.location.pathname
        }
      });

    if (error) throw error;

  } catch (err) {
    alert('خطأ أثناء بدء تسجيل الدخول بجوجل: ' + err.message);
  }
}

async function handleEmailLogin(e) {
  e.preventDefault();

  const email =
    document.getElementById('loginEmail').value;

  const pass =
    document.getElementById('loginPassword').value;

  const errorBox =
    document.getElementById('authError');

  errorBox.classList.add('hidden');

  const { data, error } =
    await supabase.auth.signInWithPassword({
      email: email,
      password: pass
    });

  if (error) {
    errorBox.textContent = error.message;
    errorBox.classList.remove('hidden');
  } else {
    currentUser = data.user;
    updateAuthUI();
    navigateTo('home');
  }
}

async function handleEmailSignUp(e) {
  e.preventDefault();

  const name =
    document.getElementById('regName').value;

  const email =
    document.getElementById('regEmail').value;

  const pass =
    document.getElementById('regPassword').value;

  const category =
    document.getElementById('regCategory').value;

  const specialty =
    document.getElementById('regSpecialty').value;

  const region =
    document.getElementById('regRegion').value;

  const errorBox =
    document.getElementById('authError');

  errorBox.classList.add('hidden');

  const { data, error } =
    await supabase.auth.signUp({
      email: email,
      password: pass,
      options: {
        data: {
          full_name: name,
          category: category,
          specialty: specialty,
          region: region
        }
      }
    });

  if (error) {
    errorBox.textContent = error.message;
    errorBox.classList.remove('hidden');
  } else {
    alert(
      'تم إنشاء الحساب بنجاح! يرجى التحقق من بريدك إذا طُلب التأكيد.'
    );

    currentUser = data.user;
    updateAuthUI();
    navigateTo('home');
  }
}

async function handleSignOut() {
  await supabase.auth.signOut();
  currentUser = null;
  updateAuthUI();
  navigateTo('home');
}

function updateRegistrationSpecialties() {
  const cat =
    document.getElementById('regCategory').value;

  const specSelect =
    document.getElementById('regSpecialty');

  if (!specSelect) return;

  specSelect.innerHTML = '';

  if (cat === 'user') {

    const specs = [
      'تاجر',
      'حلاق',
      'مواسيرجي',
      'عامل بناء',
      'نجار',
      'دهان',
      'بلاط وديكور',
      'عامل نظافة',
      'سائق / نقل',
      'كوافيرة',
      'طباخ / خدمات طعام',
      'خياط',
      'مصور / صانع محتوى'
    ];

    specs.forEach(s => {
      const opt = document.createElement('option');
      opt.value = s;
      opt.textContent = s;
      specSelect.appendChild(opt);
    });

  } else if (cat === 'technician') {

    const specs = [
      'فني صيانة',
      'كهربائي',
      'ميكانيكي سيارات',
      'فني تكييف وتبريد',
      'فني صيانة أجهزة وهواتف',
      'فني كمبيوتر'
    ];

    specs.forEach(s => {
      const opt = document.createElement('option');
      opt.value = s;
      opt.textContent = s;
      specSelect.appendChild(opt);
    });

  } else if (cat === 'farmer') {

    const opt = document.createElement('option');
    opt.value = 'مزارع';
    opt.textContent = 'مزارع';
    specSelect.appendChild(opt);
  }
}

function toggleRadio() {
  radioPlaying = !radioPlaying;

  const btn =
    document.getElementById('radioPlayBtn');

  const wave =
    document.getElementById('radioWave');

  if (btn) {
    btn.textContent =
      radioPlaying
        ? '⏸ إيقاف مؤقت'
        : '▶ تشغيل البث';
  }

  if (wave) {
    wave.style.opacity =
      radioPlaying ? '1' : '0.2';
  }
}
